[project]
name = "ulss9-chatbot"
version = "2.2.0"
description = "RAG-based healthcare information assistant for Azienda ULSS 9 Scaligera"
authors = [
    {name = "UniVR Student Services"},
]
dependencies = [
    "google-genai>=1.49.0",
    "fastapi",
    "uvicorn[standard]",
    "python-dotenv",
    "jinja2",
    "python-multipart",
    "aiofiles",
    "httpx",
    "bcrypt>=5.0.0",
    "pyjwt>=2.11.0",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.0",
    "aiosqlite>=0.20.0",
    "prometheus-client>=0.20.0",
]
requires-python = ">=3.12"

[project.optional-dependencies]
jupyter = [
    "jupyter",
    "ipython"
]
dev = [
    "ruff",
    "pytest",
    "pytest-asyncio",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
